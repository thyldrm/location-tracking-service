# Local development and demo stack.
#
#   docker compose up -d                          # infrastructure only (run the app with npm)
#   docker compose --profile app up -d --build    # infrastructure + migrations + api + worker containers

name: location-tracking

x-app: &app
  build:
    context: .
    target: runtime
  image: location-tracking-service:local
  init: true # forwards SIGTERM to Node and reaps zombie processes
  # Docker's default (10 s) is shorter than the drain delay plus a slow close; SHUTDOWN_TIMEOUT_MS is 25 s.
  stop_grace_period: 30s
  restart: unless-stopped
  profiles: ['app']
  environment: &app-env
    NODE_ENV: production
    LOG_LEVEL: info
    LOG_FORMAT: json
    API_KEYS: local-development-api-key-change-me-0123456789
    HTTP_HOST: 0.0.0.0
    HTTP_PORT: '3000'
    POSTGRES_HOST: postgres
    POSTGRES_PORT: '5432'
    POSTGRES_USER: location
    POSTGRES_PASSWORD: location
    POSTGRES_DB: location_tracking
    KAFKA_BROKERS: kafka:29092
    REDIS_URL: redis://redis:6379
  depends_on:
    postgres:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
    provision-topics:
      condition: service_completed_successfully
    kafka:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck:
    test:
      [
        'CMD',
        'node',
        '-e',
        "fetch('http://127.0.0.1:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
      ]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 20s

services:
  postgres:
    image: postgis/postgis:18-3.6-alpine
    environment:
      POSTGRES_USER: location
      POSTGRES_PASSWORD: location
      POSTGRES_DB: location_tracking
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U location -d location_tracking']
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.3.1
    environment:
      # Single-node KRaft cluster (no ZooKeeper): this node is both broker and controller.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL is used by containers on the compose network, EXTERNAL by processes on the host.
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Topics are created explicitly with the intended partition count; never implicitly.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - '9092:9092'
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1',
        ]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 15s

  redis:
    image: redis:8.8-alpine
    # Used as a cache and rate-limit store: losing it must never lose data, so persistence is off.
    command:
      [
        'redis-server',
        '--save',
        '',
        '--appendonly',
        'no',
        '--maxmemory',
        '256mb',
        '--maxmemory-policy',
        'allkeys-lru',
      ]
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # One-off job: applies pending migrations, then exits. api and worker start only if it succeeds.
  migrate:
    <<: *app
    command: ['node', 'dist/migrate.js', 'run']
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true

  # One-off job: creates missing Kafka topics, then exits.
  provision-topics:
    <<: *app
    command: ['node', 'dist/provision-topics.js']
    restart: 'no'
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      disable: true

  api:
    <<: *app
    command: ['node', 'dist/main.js']
    ports:
      - '3000:3000'

  worker:
    <<: *app
    command: ['node', 'dist/worker.js']
    ports:
      - '3001:3000'

volumes:
  postgres-data:
  kafka-data:
